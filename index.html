<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Pets🐾</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="cadastro">
        <h1>Cadastre seu Pet🐾</h1>
        <input type="text" id="tutor" placeholder="Insira o nome do tutor"  required>
        <input type="text" id="pet" placeholder="Insira o nome do pet" required>
        <input type="text" id="raca" placeholder="Insira a raça do pet" required>

        <select id="genero">
            <option class="opcao">Selecione o gênero do pet</option>
            <option>Macho</option>
            <option>Fêmea</option>
        </select>
        
        <input type="number" step="0.01" id="peso" placeholder="Insira o peso do pet" required>
        <input type="number" id="idade" placeholder="Insira a idade do pet" required>

        <select id="tempo">
            <option class="opcao">A idade foi dada em</option>
            <option>Meses</option>
            <option>Anos</option>
        </select>

        <button type="submit" id="btn">Enviar</button>
    </div>

    <script src="./script.js"></script>
</body>
</html>
